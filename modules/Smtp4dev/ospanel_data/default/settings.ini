[main]

additional_ssl_hosts     = 127.0.0.1
ignore_shutdown_all      = off
ip                       = auto
port                     = 25
clean_directories        = {root_dir}\temp\{module_name}\{profile_name}
ssl_auto_cert            = on
start_command            = "{root_dir}\modules\{module_name}\w3wp.Smtp4dev.exe" --baseappdatapath="{root_dir}\modules\{module_name}\Smtp4dev" --db="{root_dir}\data\{module_name}\{profile_name}\database.db" --hostname={module_name} --smtpport={port} --urls="http://{ip}" --tlscertificate="{root_dir}\\data\\ssl\\modules\\{module_name}\\cert.crt" --tlscertificateprivatekey="{root_dir}\\data\\ssl\\modules\\{module_name}\\cert.key"
start_directory          = {root_dir}\modules\{module_name}
work_directories         = {root_dir}\data\{module_name}\{profile_name} {root_dir}\temp\{module_name}\{profile_name}

allowed_system_env_vars  = auto
log_max_filesize         = auto
log_write_title          = auto
max_probation_fails      = auto
max_shutdown_time        = auto
probation                = auto
silent_mode              = auto
terminal_codepage        = auto
used_addons_environment  = auto

[web.config]

comment                  = 
destination              = {root_dir}\modules\{module_name}\Smtp4dev\web.config
directory_separator      = \
enabled                  = on
encoding                 = UTF8

[env.bat]

comment                  = ::
destination              = {root_dir}\data\cli\env_{module_name}.bat
directory_separator      = \
enabled                  = on
encoding                 = UTF8
source_dir               = {root_dir}\system\templates

[environment]

PATH                     = {root_dir}\modules\{module_name};%PATH%
TEMP                     = {root_dir}\temp\{module_name}\{profile_name}
TMP                      = {root_dir}\temp\{module_name}\{profile_name}
