            Options            +Indexes +ExecCGI
            Require            all granted
            <FilesMatch "\.shtml$">
                Options        +Includes
            </FilesMatch>
            <FilesMatch "\.(cgi|shtml|phtml|php|pl)$">
                SSLOptions     +StdEnvVars
            </FilesMatch>
        </Directory>
        DocumentRoot           "$public_dir"
        CustomLog              "${ROOTDIR}/logs/domains/$host_apache_access.log" combined
        ErrorLog               "${ROOTDIR}/logs/domains/$host_apache_error.log"
        php_value    error_log "${ROOTDIR}/logs/domains/$host_php_error.log"
        <IfModule proxy_module>
        <IfModule proxy_http_module>
            ProxyPreserveHost  On
            ProxyRequests      Off
            ProxyVia           full
            RequestHeader      unset Accept-Encoding
            # ProxyPass        /ws/ "ws://$backend_ip:$backend_port/"
            # ProxyPassReverse /ws/ "ws://$backend_ip:$backend_port/"
            ProxyPass          / "http://$backend_ip:$backend_port/"
            ProxyPassReverse   / "http://$backend_ip:$backend_port/"
            <IfModule headers_module>
                RequestHeader  set X-Forwarded-For %{X-Forwarded-For}i
                RequestHeader  set X-Forwarded-Proto "https"
                RequestHeader  set X-Real-IP %{REMOTE_ADDR}e
            </IfModule>
        </IfModule>
        </IfModule>
        IncludeOptional        "${SRVROOT}/conf/env/$host.conf"
        IncludeOptional        "$base_dir/.osp/apache/$host.conf"
    </VirtualHost>
    </IfModule>
</Macro>

# -----------------------------------------------------------------------------------
# Virtual Hosts
# -----------------------------------------------------------------------------------

{apache_hosts}

UndefMacro Default_Host
UndefMacro Default_SSL_Host
UndefMacro Host
UndefMacro SSL_Host
UndefMacro Proxy_Host
UndefMacro Proxy_SSL_Host
