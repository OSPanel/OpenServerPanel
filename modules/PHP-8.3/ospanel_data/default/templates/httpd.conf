# -----------------------------------------------------------------------------------
# General settings
# -----------------------------------------------------------------------------------

AcceptFilter            http none
AcceptFilter            https none
Define                  SRVROOT "{root_dir}/modules/{module_name}/Apache"
Define                  ROOTDIR "{root_dir}"
DocumentRoot            "${ROOTDIR}/system/public_html/default"
EnableMMAP              Off
EnableSendfile          Off
ExtendedStatus          On
HostnameLookups         Off
KeepAliveTimeout        60
LimitRequestLine        8190
MaxKeepAliveRequests    1000
# MaxRanges             1
PidFile                 "${ROOTDIR}/temp/{module_name}.pid"
ServerName              ospanel
ServerRoot              "${SRVROOT}"
ServerSignature         Off
ServerTokens            Prod
# ThreadsPerChild       128
ThreadStackSize         8388608
Timeout                 60
UseCanonicalName        Off

