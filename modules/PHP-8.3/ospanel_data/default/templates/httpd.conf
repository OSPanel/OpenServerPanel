# -----------------------------------------------------------------------------------
# Additional settings
# -----------------------------------------------------------------------------------

<Directory />
    AllowOverride      None
    Options            FollowSymLinks
    Require            all denied
</Directory>

<Directory "${ROOTDIR}/system/public_html/default">
    AllowOverride      None
    Options            +Indexes
    Require            all granted
    <IfModule ssl_module>
        <FilesMatch "\.(cgi|shtml|phtml|php|pl)$">
            SSLOptions +StdEnvVars
        </FilesMatch>
    </IfModule>
</Directory>

<LocationMatch "/\.(?!well-known)">
    Require            all denied
</LocationMatch>

<IfModule headers_module>
    RequestHeader      unset Proxy early
</IfModule>

<IfModule status_module>
    ExtendedStatus     On
    SeeRequestTail     On
    <IfModule proxy_module>
        ProxyStatus    On
    </IfModule>
</IfModule>

<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20-40,MinRate=500
</IfModule>

<IfModule antiloris_module>
    IPOtherLimit       16
    IPReadLimit        16
    IPWriteLimit       16
    LocalIPs           127.0.0.1 ::1
</IfModule>

<IfModule remoteip_module>
    RemoteIPHeader     X-Real-IP
</IfModule>

<IfModule php_module>
    PHPINIDir          "${ROOTDIR}/modules/{module_name}/PHP"
</IfModule>

<IfModule perl_module>
    PerlModule         Apache2::Reload
    PerlInitHandler    Apache2::Reload
    <FilesMatch "\.(cgi|pl)$">
        Options        +ExecCGI
        Require        all granted
        PerlResponseHandler ModPerl::Registry
        PerlOptions    +ParseHeaders
        PerlOptions    +SetupEnv
    </FilesMatch>
</IfModule>

<IfModule watch_module>
    WatchStateDirectory "${ROOTDIR}/temp/{module_name}/{profile_name}/watch"
</IfModule>

<IfModule maxminddb_module>
    MaxMindDBEnable    Off
    MaxMindDBFile      COUNTRY_DB   "${ROOTDIR}/user/geo/dbip-country-lite.mmdb"
    MaxMindDBEnv       COUNTRY_CODE COUNTRY_DB/country/iso_code
    MaxMindDBEnv       COUNTRY_NAME COUNTRY_DB/country/names/en
</IfModule>

<IfModule headers_module>
    #Header      unset Access-Control-Allow-Origin
    #Header      unset Referrer-Policy
    #Header      unset Strict-Transport-Security
    #Header      unset Timing-Allow-Origin
    #Header      unset X-Content-Type-Options
    #Header      unset X-Frame-Options

    #Header always set Access-Control-Allow-Origin "*"                 "expr=%{CONTENT_TYPE} =~ m#text/html#i"
    #Header always set Referrer-Policy             "strict-origin-when-cross-origin"  "expr=%{CONTENT_TYPE} =~ m#text/html#i"
    #Header always set Strict-Transport-Security   "max-age=94608000"  "expr=%{CONTENT_TYPE} =~ m#text/html#i"
    #Header always set Timing-Allow-Origin         "*"                 "expr=%{CONTENT_TYPE} =~ m#text/html#i"
    #Header always set X-Content-Type-Options      "nosniff"
    #Header always set X-Frame-Options             "SAMEORIGIN"        "expr=%{CONTENT_TYPE} =~ m#text/html#i"
</IfModule>

<IfModule expires_module>
    #ExpiresActive     on
    #ExpiresDefault    "access plus 1 days"
    #ExpiresByType     application/atom+xml                "access plus 1 hours"
    #ExpiresByType     application/rss+xml                 "access plus 1 hours"
    #ExpiresByType     application/json                    "access plus 0 seconds"
    #ExpiresByType     application/xml                     "access plus 0 seconds"
    #ExpiresByType     text/xml                            "access plus 0 seconds"
    #ExpiresByType     text/html                           "access plus 0 seconds"
    #ExpiresByType     application/x-web-app-manifest+json "access plus 0 seconds"
    #ExpiresByType     text/cache-manifest                 "access plus 0 seconds"
    #ExpiresByType     application/manifest+json           "access plus 0 seconds"
</IfModule>

<IfModule filter_module>
    <IfModule brotli_module>
        BrotliCompressionQuality 5
        AddOutputFilterByType BROTLI_COMPRESS text/html application/atom+xml application/json text/json text/xml text/javascript application/ld+json application/rss+xml application/geo+json application/xml application/rdf+xml application/javascript application/wasm application/rtf application/pdf application/xhtml+xml application/xslt+xml application/manifest+json application/x-web-app-manifest+json application/vnd.ms-fontobject font/woff font/woff2 font/ttf font/collection font/otf image/vnd.microsoft.icon image/x-icon image/svg+xml text/css text/csv text/plain text/markdown text/calendar text/vcard text/vtt text/cache-manifest text/vnd.rim.location.xloc text/x-component
    </IfModule>
    <IfModule deflate_module>
        DeflateCompressionLevel 5
        AddOutputFilterByType DEFLATE text/html application/atom+xml application/json text/json text/xml text/javascript application/ld+json application/rss+xml application/geo+json application/xml application/rdf+xml application/javascript application/wasm application/rtf application/pdf application/xhtml+xml application/xslt+xml application/manifest+json application/x-web-app-manifest+json application/vnd.ms-fontobject font/woff font/woff2 font/ttf font/collection font/otf image/vnd.microsoft.icon image/x-icon image/svg+xml text/css text/csv text/plain text/markdown text/calendar text/vcard text/vtt text/cache-manifest text/vnd.rim.location.xloc text/x-component
    </IfModule>
</IfModule>

# -----------------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------------

ErrorLog               "${ROOTDIR}/logs/{module_name}/apache_error.log"
LogLevel               {log_level}
BufferedLogs           Off

<IfModule log_config_module>
    LogFormat          "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat          "%h %l %u %t \"%r\" %>s %b" common
    LogFormat          "%h %l %u %t %>s \"%r\" %b %{REQUEST_BODY}n" post_log
    LogFormat          "%h %l %u %t %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b" ssl_log

    <IfModule logio_module>
        LogFormat      "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    CustomLog  "${ROOTDIR}/logs/{module_name}/apache_access.log" combined
</IfModule>

Include                "${SRVROOT}/conf/errors.conf"

# -----------------------------------------------------------------------------------
# MIME
# -----------------------------------------------------------------------------------

<IfModule mime_module>
    TypesConfig        "${SRVROOT}/conf/mime.types"

    #AddEncoding       x-compress              .Z
    #AddEncoding       x-gzip                  .gz  .tgz
    AddHandler         cgi-script              .cgi .pl

    <IfModule filter_module>
        AddOutputFilter INCLUDES               .shtml
    </IfModule>

    <IfModule perl_module>
        RemoveHandler  .cgi .pl
        AddHandler     perl-script             .cgi .pl
    </IfModule>

    <IfModule php_module>
        AddType        application/x-httpd-php .php .phtml
    </IfModule>
</IfModule>

<IfModule mime_magic_module>
    MIMEMagicFile      "${SRVROOT}/conf/magic"
</IfModule>

<IfModule dir_module>
    DirectoryIndex     index.php index.html index.htm index.shtml index.pl index.cgi
</IfModule>

Include                "${SRVROOT}/conf/autoindex.conf"
Include                "${SRVROOT}/conf/languages.conf"
# DefaultLanguage      en
AddDefaultCharset      utf-8

# -----------------------------------------------------------------------------------
# SSL
# -----------------------------------------------------------------------------------

<IfModule ssl_module>
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLProxyCipherSuite     ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLOpenSSLConfCmd       Curves X25519:prime256v1:secp384r1
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLProxyProtocol        -all +TLSv1.2 +TLSv1.3
    SSLRandomSeed startup   builtin
    SSLRandomSeed connect   builtin
    SSLSessionCache         "shmcb:logs/ssl_session_cache(262144)"
    SSLSessionCacheTimeout  86400
    SSLSessionTickets       Off
    SSLStrictSNIVHostCheck  Off
    SSLUseStapling          Off
    SSLStaplingCache        "shmcb:logs/ssl_stapling(65536)"
</IfModule>

# -----------------------------------------------------------------------------------
# WebDav
# Required modules: mod_alias, mod_auth_digest, mod_authn_core, mod_authn_file,
#                   mod_authz_core, mod_authz_user, mod_dav, mod_dav_fs, mod_setenvif
# -----------------------------------------------------------------------------------

<IfModule dav_module>
    DavLockDB "${ROOTDIR}/Data/{module_name}/{profile_name}/DavLock"
    Alias /uploads "${ROOTDIR}/temp/upload"

    <Directory "/uploads">
        Dav On

        AuthType Digest
        AuthName DAV-upload
        AuthUserFile "${ROOTDIR}/user/user.passwd"
        AuthDigestProvider file

        <RequireAny>
            Require method GET POST OPTIONS
            Require user admin
        </RequireAny>
    </Directory>

    BrowserMatch "Microsoft Data Access Internet Publishing Provider" redirect-carefully
    BrowserMatch "MS FrontPage" redirect-carefully
    BrowserMatch "^WebDrive" redirect-carefully
    BrowserMatch "^WebDAVFS/1.[01234]" redirect-carefully
    BrowserMatch "^gnome-vfs/1.0" redirect-carefully
    BrowserMatch "^XML Spy" redirect-carefully
    BrowserMatch "^Dreamweaver-WebDAV-SCM1" redirect-carefully
    BrowserMatch " Konqueror/4" redirect-carefully
</IfModule>

# -----------------------------------------------------------------------------------
# Virtual Host Macros
# -----------------------------------------------------------------------------------

<Macro Default_Host $ip>
    <VirtualHost $ip>
        ServerName             default
        <Location /apacheerror/>
            Require            all granted
        </Location>
        <Location /apacheicons/>
            Require            all granted
        </Location>
        <IfModule status_module>
            <Location /server-status>
                SetHandler     server-status
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
        <IfModule info_module>
            <Location /server-info>
                SetHandler     server-info
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
        <IfModule watch_module>
            <Location /watch-table>
                SetHandler     watch-table
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
    </VirtualHost>
</Macro>

<Macro Default_SSL_Host $ip $ssl_cert_file $ssl_key_file>
    <IfModule ssl_module>
    <VirtualHost $ip>
        ServerName             default
        SSLEngine              on
        SSLCertificateFile     "$ssl_cert_file"
        SSLCertificateKeyFile  "$ssl_key_file"
        <Location /apacheerror/>
            Require            all granted
        </Location>
        <Location /apacheicons/>
            Require            all granted
        </Location>
        <IfModule status_module>
            <Location /server-status>
                SetHandler     server-status
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
        <IfModule info_module>
            <Location /server-info>
                SetHandler     server-info
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
        <IfModule watch_module>
            <Location /watch-table>
                SetHandler     watch-table
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
    </VirtualHost>
    </IfModule>
</Macro>

<Macro Host $host $ip $aliases $base_dir $public_dir>
    <VirtualHost $ip>
        <Directory "$public_dir">
            AllowOverride      All
            Options            +Indexes +ExecCGI
            Require            all granted
            <FilesMatch "\.shtml$">
                Options        +Includes
            </FilesMatch>
        </Directory>
        ServerName             $host
        ServerAlias            $aliases
        DocumentRoot           "$public_dir"
        CustomLog              "${ROOTDIR}/logs/domains/$host_apache_access.log" combined
        ErrorLog               "${ROOTDIR}/logs/domains/$host_apache_error.log"
        php_value    error_log "${ROOTDIR}/logs/domains/$host_php_error.log"
        IncludeOptional        "${SRVROOT}/conf/env/$host.conf"
        IncludeOptional        "$base_dir/.osp/apache/$host.conf"
    </VirtualHost>
</Macro>

<Macro SSL_Host $host $ip $aliases $base_dir $public_dir $ssl_cert_file $ssl_key_file $protocols>
    <IfModule ssl_module>
    <VirtualHost $ip>
        <IfModule http2_module>
            Protocols          $protocols
        </IfModule>
        ServerName             $host
        ServerAlias            $aliases
        SSLEngine              on
        SSLCertificateFile     "$ssl_cert_file"
        SSLCertificateKeyFile  "$ssl_key_file"
        <Directory "$public_dir">
            AllowOverride      All
            Options            +Indexes +ExecCGI
            Require            all granted
            <FilesMatch "\.shtml$">
                Options        +Includes
            </FilesMatch>
            <FilesMatch "\.(cgi|shtml|phtml|php|pl)$">
                SSLOptions     +StdEnvVars
            </FilesMatch>
        </Directory>
        DocumentRoot           "$public_dir"
        CustomLog              "${ROOTDIR}/logs/domains/$host_apache_access.log" combined
        ErrorLog               "${ROOTDIR}/logs/domains/$host_apache_error.log"
        php_value    error_log "${ROOTDIR}/logs/domains/$host_php_error.log"
        IncludeOptional        "${SRVROOT}/conf/env/$host.conf"
        IncludeOptional        "$base_dir/.osp/apache/$host.conf"
    </VirtualHost>
    </IfModule>
</Macro>

<Macro Proxy_Host $host $ip $aliases $base_dir $public_dir $backend_ip $backend_port>
    <VirtualHost $ip>
        <Directory "$public_dir">
            AllowOverride      All
            Options            +Indexes +ExecCGI
            Require            all granted
            <FilesMatch "\.shtml$">
                Options        +Includes
            </FilesMatch>
        </Directory>
        ServerName             $host
        ServerAlias            $aliases
        DocumentRoot           "$public_dir"
        CustomLog              "${ROOTDIR}/logs/domains/$host_apache_access.log" combined
        ErrorLog               "${ROOTDIR}/logs/domains/$host_apache_error.log"
        php_value    error_log "${ROOTDIR}/logs/domains/$host_php_error.log"
        <IfModule proxy_module>
        <IfModule proxy_http_module>
            ProxyPreserveHost  On
            ProxyRequests      Off
            ProxyVia           full
            RequestHeader      unset Accept-Encoding
            # ProxyPass        /ws/ "ws://$backend_ip:$backend_port/"
            # ProxyPassReverse /ws/ "ws://$backend_ip:$backend_port/"
            ProxyPass          / "http://$backend_ip:$backend_port/"
            ProxyPassReverse   / "http://$backend_ip:$backend_port/"
            <IfModule headers_module>
                RequestHeader  set X-Forwarded-For %{X-Forwarded-For}i
                RequestHeader  set X-Forwarded-Proto "http"
                RequestHeader  set X-Real-IP %{REMOTE_ADDR}e
            </IfModule>
        </IfModule>
        </IfModule>
        IncludeOptional        "${SRVROOT}/conf/env/$host.conf"
        IncludeOptional        "$base_dir/.osp/apache/$host.conf"
    </VirtualHost>
</Macro>

<Macro Proxy_SSL_Host $host $ip $aliases $base_dir $public_dir $ssl_cert_file $ssl_key_file $protocols $backend_ip $backend_port>
    <IfModule ssl_module>
    <VirtualHost $ip>
        <IfModule http2_module>
            Protocols          $protocols
        </IfModule>
        ServerName             $host
        ServerAlias            $aliases
