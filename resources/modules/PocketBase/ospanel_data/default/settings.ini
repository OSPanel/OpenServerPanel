[main]

additional_ssl_hosts     =
clean_directories        = {root_dir}\temp\{module_name}\{profile_name}
ignore_shutdown_all      = off
ip                       = auto
port                     = 8090
log_directory            = {root_dir}\logs\{module_name}
query_log_values         = empty --dev
query_log_level          = empty
shell_command            = 
ssl_auto_cert            = off
start_command            = "{root_dir}\modules\{module_name}\pocketbase.exe" serve --http {ip}:{port} --dir "{root_dir}\data\{module_name}\{profile_name}\pb_data" --publicDir "{root_dir}\data\{module_name}\{profile_name}\pb_public" --hooksDir "{root_dir}\data\{module_name}\{profile_name}\pb_hooks" --migrationsDir "{root_dir}\data\{module_name}\{profile_name}\pb_migrations" {query_log_level}
start_directory          = {root_dir}\modules\{module_name}
web_ui_url               = http://{module_name}:{port}/_/
work_directories         = {root_dir}\data\{module_name}\{profile_name}\pb_public {root_dir}\data\{module_name}\{profile_name}\pb_data {root_dir}\data\{module_name}\{profile_name}\pb_hooks {root_dir}\data\{module_name}\{profile_name}\pb_migrations {root_dir}\temp\{module_name}\{profile_name}

allowed_system_env_vars  = auto
log_max_filesize         = auto
log_write_title          = auto
max_probation_fails      = auto
max_shutdown_time        = auto
probation                = auto
silent_mode              = auto
terminal_codepage        = auto
time_zone                = auto
used_addons_environment  = auto

[env.bat]

comment                  = ::
destination              = {root_dir}\data\cli\env_{module_name}.bat
directory_separator      = \
enabled                  = on
encoding                 = UTF8
source_dir               = {root_dir}\system\templates

[environment]

PATH                     = {root_dir}\modules\{module_name};%PATH%
TEMP                     = {root_dir}\temp\{module_name}\{profile_name}
TMP                      = {root_dir}\temp\{module_name}\{profile_name}
TZ                       = {time_zone}
