[main]

additional_ssl_hosts     =
clean_directories        = {root_dir}\temp\{module_name}\{profile_name}
ignore_shutdown_all      = off
ip                       = auto
port                     = 443
log_directory            = {root_dir}\logs\{module_name}
log_level_values         = error warn info debug
log_level                = info
shell_command            = 
ssl_auto_cert            = on
start_command            = "{root_dir}\modules\{module_name}\sftpgo.exe" serve
start_directory          = {root_dir}\modules\{module_name}
web_ui_url               = https://{module_name}:{port}/
work_directories         = {root_dir}\data\{module_name}\{profile_name} {root_dir}\data\{module_name}\{profile_name}\host-keys {root_dir}\temp\{module_name}\{profile_name}

allowed_system_env_vars  = auto
log_max_filesize         = auto
log_write_title          = auto
max_probation_fails      = auto
max_shutdown_time        = auto
probation                = auto
silent_mode              = auto
terminal_codepage        = auto
time_zone                = auto
used_addons_environment  = auto

[sftpgo.json]

comment                  =
destination              = {root_dir}\modules\{module_name}\sftpgo.json
directory_separator      = /
enabled                  = on
encoding                 = UTF8

[env.bat]

comment                  = ::
destination              = {root_dir}\data\cli\env_{module_name}.bat
directory_separator      = \
enabled                  = on
encoding                 = UTF8
source_dir               = {root_dir}\system\templates

[environment]

PATH                     = {root_dir}\modules\{module_name};%PATH%
SFTPGO_CONFIG_DIR        = {root_dir}\modules\{module_name}
SFTPGO_CONFIG_FILE       = {root_dir}\modules\{module_name}\sftpgo.json
SFTPGO_GRACE_TIME        = 3
SFTPGO_LOADDATA_FROM     =
SFTPGO_LOADDATA_CLEAN    =
SFTPGO_LOADDATA_MODE     =
SFTPGO_LOADDATA_QUOTA_SCAN =
SFTPGO_LOG_FILE_PATH     = {root_dir}\logs\{module_name}\server.log
SFTPGO_LOG_MAX_AGE       = 28
SFTPGO_LOG_MAX_BACKUPS   = 10
SFTPGO_LOG_MAX_SIZE      = 100
SFTPGO_LOG_LEVEL         = {log_level}
SFTPGO_LOG_UTC_TIME      = 0
SFTPGO_LOG_COMPRESS      = 0
TEMP                     = {root_dir}\temp\{module_name}\{profile_name}
TMP                      = {root_dir}\temp\{module_name}\{profile_name}
TZ                       = {time_zone}
