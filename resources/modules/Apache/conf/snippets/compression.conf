# ======================================================================
# Dynamic compression only: Brotli + Deflate by Content-Type
# Correct headers (Vary)
#
# Requires: mod_filter; mod_headers; plus mod_brotli and/or mod_deflate
# ======================================================================

<IfModule filter_module>

  <IfModule brotli_module>
    BrotliAlterETag NoChange
    BrotliCompressionQuality 3
    AddOutputFilterByType BROTLI_COMPRESS \
      text/html \
      text/css \
      text/plain \
      text/csv \
      text/markdown \
      text/calendar \
      text/vcard \
      text/vtt \
      text/cache-manifest \
      text/javascript \
      text/x-component \
      application/javascript \
      application/json \
      application/ld+json \
      application/schema+json \
      application/geo+json \
      application/xml \
      application/rdf+xml \
      application/rss+xml \
      application/atom+xml \
      application/xhtml+xml \
      application/xslt+xml \
      application/manifest+json \
      application/x-web-app-manifest+json \
      application/rtf \
      application/x-x509-ca-cert \
      application/wasm \
      image/svg+xml \
      application/vnd.ms-fontobject \
      font/ttf \
      font/collection \
      font/otf
  </IfModule>

  <IfModule deflate_module>
    DeflateAlterETag NoChange
    DeflateCompressionLevel 3
    AddOutputFilterByType DEFLATE \
      text/html \
      text/css \
      text/plain \
      text/csv \
      text/markdown \
      text/calendar \
      text/vcard \
      text/vtt \
      text/cache-manifest \
      text/javascript \
      text/x-component \
      application/javascript \
      application/json \
      application/ld+json \
      application/schema+json \
      application/geo+json \
      application/xml \
      application/rdf+xml \
      application/rss+xml \
      application/atom+xml \
      application/xhtml+xml \
      application/xslt+xml \
      application/manifest+json \
      application/x-web-app-manifest+json \
      application/rtf \
      application/x-x509-ca-cert \
      application/wasm \
      image/svg+xml \
      application/vnd.ms-fontobject \
      font/ttf \
      font/collection \
      font/otf
  </IfModule>

</IfModule>

<IfModule headers_module>
  <FilesMatch "\.(html?|css|js|mjs|json|xml|svg|txt|csv|map|webmanifest|vtt|wasm|eot|ttf|otf)$">
    Header merge Vary Accept-Encoding
  </FilesMatch>
</IfModule>