AddLanguage zh-TW     .zh-tw
AddLanguage de        .de
AddLanguage fr        .fr
AddLanguage es        .es
AddLanguage pt        .pt
AddLanguage it        .it
AddLanguage uk        .uk
AddLanguage pl        .pl
AddLanguage nl        .nl
AddLanguage sv        .sv
AddLanguage da        .da
AddLanguage fi        .fi
AddLanguage no        .no
AddLanguage hi        .hi
AddLanguage vi        .vi
AddLanguage th        .th
AddLanguage id        .id
AddLanguage tr        .tr
AddLanguage cs        .cs
AddLanguage ro        .ro
AddLanguage be        .be
AddLanguage az        .az
AddLanguage kk        .kk
AddLanguage uz        .uz
AddLanguage sr        .sr
AddLanguage hr        .hr
AddLanguage sl        .sl
AddLanguage el        .el
AddLanguage hu        .hu
AddLanguage sk        .sk
AddLanguage bg        .bg
AddLanguage lt        .lt
AddLanguage lv        .lv
AddLanguage et        .et
AddLanguage ka        .ka
AddLanguage pt-BR     .pt-br
AddLanguage es-MX     .es-mx
AddLanguage ro-MD     .ro-md

# Negotiation priorities: English first, then major languages/regions, then others.
LanguagePriority \
  en \
  zh-CN zh-TW \
  es es-MX \
  pt pt-BR \
  fr de ru ar hi \
  ja ko id tr vi th \
  it nl pl uk ro ro-MD be cs bg sk hu el \
  sv da fi no \
  ms az kk uz sr hr sl lt lv et ka he

# Ensure Apache prefers best match and falls back to the next (ultimately to English)
ForceLanguagePriority Prefer Fallback

AddCharset us-ascii         .ascii      .us-ascii
AddCharset ISO-8859-1       .iso8859-1  .latin1
