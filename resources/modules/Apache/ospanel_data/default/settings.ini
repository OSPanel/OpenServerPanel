[main]

additional_ssl_hosts     =
clean_directories        = {root_dir}\modules\{module_name}\conf\env {root_dir}\modules\{module_name}\conf\custom
ip                       = auto
ignore_shutdown_all      = off
log_directory            = {root_dir}\logs\{module_name}
log_level_values         = emerg alert crit error warn notice info debug trace1 trace2 trace3 trace4 trace5 trace6 trace7 trace8
log_level                = warn
ssl_auto_cert            = on
start_command            = "{root_dir}\modules\{module_name}\bin\httpd.exe" -f "{root_dir}\modules\{module_name}\conf\httpd.conf"
start_directory          = {root_dir}\modules\{module_name}\bin
work_directories         = {root_dir}\modules\{module_name}\conf\env {root_dir}\modules\{module_name}\conf\custom {root_dir}\modules\{module_name}\logs {root_dir}\logs\domains {root_dir}\temp\upload {root_dir}\temp\{module_name}\{profile_name}\watch {root_dir}\data\{module_name}\{profile_name}\storage

allowed_system_env_vars  = auto
log_max_filesize         = auto
log_write_title          = auto
max_probation_fails      = auto
max_shutdown_time        = auto
probation                = auto
silent_mode              = auto
terminal_codepage        = auto
time_zone                = auto
used_addons_environment  = auto

[httpd.conf]

comment                  = #
destination              = {root_dir}\modules\{module_name}\conf\httpd.conf
directory_separator      = /
enabled                  = on
encoding                 = ASCII

[env.bat]

comment                  = ::
destination              = {root_dir}\data\cli\env_{module_name}.bat
directory_separator      = \
enabled                  = on
encoding                 = UTF8
source_dir               = {root_dir}\system\templates

[environment]

OPENSSL_CONF             = {root_dir}\modules\{module_name}\conf\openssl.cnf
OPENSSL_WIN32_UTF8       = 1
PATH                     = {root_dir}\modules\{module_name}\bin;%PATH%
SRVROOT                  = {root_dir}\modules\{module_name}
TEMP                     = {root_dir}\temp\{module_name}\{profile_name}
TMP                      = {root_dir}\temp\{module_name}\{profile_name}
