# -----------------------------------------------------------------------------------
# Additional settings
# -----------------------------------------------------------------------------------

<Directory />
    AllowOverride      None
    Options            FollowSymLinks
    Require            all denied
</Directory>

<Directory "${ROOTDIR}/system/public_html/default">
    AllowOverride      None
    Options            -Indexes
    Require            all granted
    <IfModule ssl_module>
        <FilesMatch "\.(php|shtml|phtml|cgi|pl)$">
            SSLOptions +StdEnvVars
        </FilesMatch>
    </IfModule>
</Directory>

<LocationMatch "/\.(?!well-known)">
    Require            all denied
</LocationMatch>

<IfModule md_module>
    MDCAChallenges         http-01
    MDCertificateAgreement accepted
    MDCertificateAuthority https://acme-v02.api.letsencrypt.org/directory
    MDRequireHttps         off
    MDStoreDir             "${ROOTDIR}/data/{module_name}/{profile_name}/storage"
</IfModule>

<IfModule headers_module>
    RequestHeader      unset Proxy early
</IfModule>

<IfModule status_module>
    ExtendedStatus     On
    SeeRequestTail     On
    <IfModule proxy_module>
        ProxyStatus    On
    </IfModule>
</IfModule>

<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20-40,MinRate=500
</IfModule>

<IfModule antiloris_module>
    IPOtherLimit       16
    IPReadLimit        16
    IPWriteLimit       16
    LocalIPs           127.0.0.1 ::1
</IfModule>

<IfModule remoteip_module>
    RemoteIPHeader     X-Real-IP
</IfModule>

<IfModule watch_module>
    WatchStateDirectory "${ROOTDIR}/temp/{module_name}/{profile_name}/watch"
</IfModule>

<IfModule maxminddb_module>
    MaxMindDBEnable    Off
    MaxMindDBFile      COUNTRY_DB   "${ROOTDIR}/user/geo/dbip-country-lite.mmdb"
    MaxMindDBEnv       COUNTRY_CODE COUNTRY_DB/country/iso_code
    MaxMindDBEnv       COUNTRY_NAME COUNTRY_DB/country/names/en
</IfModule>

<IfModule headers_module>
    #Header      unset Access-Control-Allow-Origin
    #Header      unset Referrer-Policy
    #Header      unset Strict-Transport-Security
    #Header      unset Timing-Allow-Origin
    #Header      unset X-Content-Type-Options
    #Header      unset X-Frame-Options

    #Header always set Access-Control-Allow-Origin "*"                 "expr=%{CONTENT_TYPE} =~ m#text/html#i"
    #Header always set Referrer-Policy             "strict-origin-when-cross-origin"  "expr=%{CONTENT_TYPE} =~ m#text/html#i"
    #Header always set Strict-Transport-Security   "max-age=94608000"  "expr=%{CONTENT_TYPE} =~ m#text/html#i"
    #Header always set Timing-Allow-Origin         "*"                 "expr=%{CONTENT_TYPE} =~ m#text/html#i"
    #Header always set X-Content-Type-Options      "nosniff"
    #Header always set X-Frame-Options             "SAMEORIGIN"        "expr=%{CONTENT_TYPE} =~ m#text/html#i"
</IfModule>

# -----------------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------------

ErrorLog               "${ROOTDIR}/logs/{module_name}/apache_error.log"
LogLevel               {log_level}
BufferedLogs           Off

LogFormat          "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat          "%h %l %u %t \"%r\" %>s %b" common
LogFormat          "%h %l %u %t %>s \"%r\" %b %{REQUEST_BODY}n" post_log
LogFormat          "%h %l %u %t %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b" ssl_log

<IfModule logio_module>
    LogFormat      "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
</IfModule>

CustomLog  "${ROOTDIR}/logs/{module_name}/apache_access.log" combined

Include                "${SRVROOT}/conf/errors.conf"

# -----------------------------------------------------------------------------------
# MIME
# -----------------------------------------------------------------------------------

<IfModule mime_module>
    TypesConfig        "${SRVROOT}/conf/mime.types"

    #AddEncoding       x-compress              .Z
    #AddEncoding       x-gzip                  .gz  .tgz
    <IfModule cgi_module>
        AddHandler     cgi-script              .cgi .pl
    </IfModule>
    <IfModule filter_module>
        AddOutputFilter INCLUDES               .shtml
    </IfModule>
</IfModule>

<IfModule mime_magic_module>
    MIMEMagicFile      "${SRVROOT}/conf/magic"
</IfModule>

<IfModule dir_module>
    DirectoryIndex     index.html index.htm index.shtml
</IfModule>

Include                "${SRVROOT}/conf/autoindex.conf"
Include                "${SRVROOT}/conf/languages.conf"
# DefaultLanguage      en
AddDefaultCharset      utf-8

# -----------------------------------------------------------------------------------
# SSL
# -----------------------------------------------------------------------------------

<IfModule ssl_module>
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLProxyCipherSuite     ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLOpenSSLConfCmd       Curves X25519:prime256v1:secp384r1
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLProxyProtocol        -all +TLSv1.2 +TLSv1.3
    SSLRandomSeed startup   builtin
    SSLRandomSeed connect   builtin
    SSLSessionCache         "shmcb:${SRVROOT}/logs/ssl_session_cache(262144)"
    SSLSessionCacheTimeout  86400
    SSLSessionTickets       Off
    SSLStaplingCache        "shmcb:${SRVROOT}/logs/ssl_stapling(65536)"
    SSLStrictSNIVHostCheck  Off
    SSLUseStapling          Off
    SSLVHostSNIPolicy       authonly
</IfModule>

# -----------------------------------------------------------------------------------
# WebDav
# Required modules: mod_alias, mod_auth_digest, mod_authn_core, mod_authn_file,
#                   mod_authz_core, mod_authz_user, mod_dav, mod_dav_fs, mod_setenvif
# -----------------------------------------------------------------------------------

<IfModule dav_module>
    DavLockDB "${ROOTDIR}/Data/{module_name}/{profile_name}/DavLock"
    Alias /uploads "${ROOTDIR}/temp/upload"

    <Directory "/uploads">
        Dav On

        AuthType Digest
        AuthName DAV-upload
        AuthUserFile "${ROOTDIR}/user/user.passwd"
        AuthDigestProvider file

        <RequireAny>
            Require method GET POST OPTIONS
            Require user admin
        </RequireAny>
    </Directory>

    BrowserMatch "Microsoft Data Access Internet Publishing Provider" redirect-carefully
    BrowserMatch "MS FrontPage" redirect-carefully
    BrowserMatch "^WebDrive" redirect-carefully
    BrowserMatch "^WebDAVFS/1.[01234]" redirect-carefully
    BrowserMatch "^gnome-vfs/1.0" redirect-carefully
    BrowserMatch "^XML Spy" redirect-carefully
    BrowserMatch "^Dreamweaver-WebDAV-SCM1" redirect-carefully
    BrowserMatch " Konqueror/4" redirect-carefully
</IfModule>

# -----------------------------------------------------------------------------------
# Virtual Host Macros
# -----------------------------------------------------------------------------------

<Macro Host_Default $bind_ip>
    <VirtualHost $bind_ip>
        ServerName             default
        <Location /apacheerror/>
            Require            all granted
        </Location>
        <Location /apacheicons/>
            Require            all granted
        </Location>
        <IfModule status_module>
            <Location /server-status>
                SetHandler     server-status
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
        <IfModule info_module>
            <Location /server-info>
                SetHandler     server-info
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
        <IfModule watch_module>
            <Location /watch-table>
                SetHandler     watch-table
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
    </VirtualHost>
</Macro>

<Macro Host_Default_SSL $bind_ip $tls_cert_file $tls_key_file>
    <IfModule ssl_module>
    <VirtualHost $bind_ip>
        ServerName             default
        SSLEngine              on
        SSLCertificateFile     "$tls_cert_file"
        SSLCertificateKeyFile  "$tls_key_file"
        <Location /apacheerror/>
            Require            all granted
        </Location>
        <Location /apacheicons/>
            Require            all granted
        </Location>
        <IfModule status_module>
            <Location /server-status>
                SetHandler     server-status
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
        <IfModule info_module>
            <Location /server-info>
                SetHandler     server-info
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
        <IfModule watch_module>
            <Location /watch-table>
                SetHandler     watch-table
                #Require       all granted
                Require        local
            </Location>
        </IfModule>
    </VirtualHost>
    </IfModule>
</Macro>

<Macro Host_Static $host $bind_ip $server_aliases $web_root>
    <VirtualHost $bind_ip>
        <Directory "$web_root">
            AllowOverride      All
            Options            +Indexes
            Require            all granted
            <FilesMatch "\.shtml$">
                Options        +Includes
            </FilesMatch>
            <IfModule cgi_module>
                <FilesMatch "\.(cgi|pl)$">
                    Options    +ExecCGI
                </FilesMatch>
            </IfModule>
        </Directory>
        ServerName             $host
        ServerAlias            $server_aliases
        DocumentRoot           "$web_root"

        # Include              "${SRVROOT}/conf/snippets/block_hidden_files.conf"
        # Include              "${SRVROOT}/conf/snippets/block_sensitive_files.conf"
        # Include              "${SRVROOT}/conf/snippets/compression.conf"
        # Include              "${SRVROOT}/conf/snippets/quiet_static_logs.conf"
        Include                "${SRVROOT}/conf/snippets/static_cache_control.conf"

        CustomLog              "${ROOTDIR}/logs/domains/$host_access.log" combined env=!dontlog
        ErrorLog               "${ROOTDIR}/logs/domains/$host_error.log"
        # SetEnvIf status 404  log_404
        # CustomLog            "${ROOTDIR}/logs/domains/$host_404.log" combined env=log_404

        IncludeOptional        "${SRVROOT}/conf/custom/$host.conf"
    </VirtualHost>
</Macro>

