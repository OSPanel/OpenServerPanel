# -----------------------------------------------------------------------------------
# General settings
# -----------------------------------------------------------------------------------

AcceptFilter            http none
AcceptFilter            https none
Define                  SRVROOT "{root_dir}/modules/{module_name}"
Define                  ROOTDIR "{root_dir}"
DocumentRoot            "${ROOTDIR}/system/public_html/default"
EnableMMAP              Off
EnableSendfile          Off
ExtendedStatus          On
HostnameLookups         Off
KeepAliveTimeout        15
LimitRequestLine        8190
MaxKeepAliveRequests    200
# MaxRanges             1
PidFile                 "${ROOTDIR}/temp/{module_name}.pid"
Protocols               http/1.1
ProxyTimeout            900
ServerAdmin             admin@local.host
ServerName              ospanel
ServerRoot              "${SRVROOT}"
ServerSignature         Off
ServerTokens            Prod
ThreadsPerChild         128
Timeout                 60
UseCanonicalName        Off

