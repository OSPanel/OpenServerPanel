<Macro Host_PHP $host $bind_ip $server_aliases $web_root $backend_ip $backend_port>
    <VirtualHost $bind_ip>
        <Directory "$web_root">
            AllowOverride      All
            Options            +Indexes
            Require            all granted
            <FilesMatch "\.shtml$">
                Options        +Includes
            </FilesMatch>
            <IfModule cgi_module>
                <FilesMatch "\.(cgi|pl)$">
                    Options    +ExecCGI
                </FilesMatch>
            </IfModule>
        </Directory>
        ServerName             $host
        ServerAlias            $server_aliases
        DocumentRoot           "$web_root"

        # Include              "${SRVROOT}/conf/snippets/block_hidden_files.conf"
        # Include              "${SRVROOT}/conf/snippets/block_sensitive_files.conf"
        # Include              "${SRVROOT}/conf/snippets/compression.conf"
        # Include              "${SRVROOT}/conf/snippets/quiet_static_logs.conf"
        Include                "${SRVROOT}/conf/snippets/static_cache_control.conf"

        CustomLog              "${ROOTDIR}/logs/domains/$host_access.log" combined env=!dontlog
        ErrorLog               "${ROOTDIR}/logs/domains/$host_error.log"
        # SetEnvIf status 404  log_404
        # CustomLog            "${ROOTDIR}/logs/domains/$host_404.log" combined env=log_404

        <IfModule dir_module>
            DirectoryIndex     index.php index.html index.htm index.shtml
            # FallbackResource /index.php
        </IfModule>

        <IfModule proxy_module>
        <IfModule proxy_fcgi_module>
        <FilesMatch "\.(php|phtml)$">
            SetHandler         "proxy:fcgi://$backend_ip:$backend_port/"
            ProxyFCGISetEnvIf  "true" DOCUMENT_ROOT   "$web_root"
            ProxyFCGISetEnvIf  "true" !HTTPS
            ProxyFCGISetEnvIf  "true" SCRIPT_FILENAME "$web_root%{reqenv:SCRIPT_NAME}"
            # ProxyFCGISetEnvIf  "%{reqenv:COUNTRY_CODE}   != ''" COUNTRY_CODE    "%{reqenv:COUNTRY_CODE}"
            # ProxyFCGISetEnvIf  "%{reqenv:COUNTRY_NAME}   != ''" COUNTRY_NAME    "%{reqenv:COUNTRY_NAME}"
            Include            "${SRVROOT}/conf/fastcgi.conf"
            ProxyFCGISetEnvIf  "reqenv('HTTP_X_FORWARDED_PROTO') = 'https'"       HTTPS "on"
            ProxyFCGISetEnvIf  "reqenv('HTTP_X_FORWARDED_PROTO') = 'https'"       REQUEST_SCHEME "https"
            ProxyFCGISetEnvIf  "reqenv('HTTP_X_FORWARDED_PROTO') = 'http'"        REQUEST_SCHEME "http"
            IncludeOptional    "${SRVROOT}/conf/env/$host.conf"
        </FilesMatch>
        </IfModule>
        </IfModule>

        IncludeOptional        "${SRVROOT}/conf/custom/$host.conf"
    </VirtualHost>
</Macro>

