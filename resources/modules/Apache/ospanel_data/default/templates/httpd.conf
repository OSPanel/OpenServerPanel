        ErrorLog               "${ROOTDIR}/logs/domains/$host_error.log"
        # SetEnvIf status 404  log_404
        # CustomLog            "${ROOTDIR}/logs/domains/$host_404.log" combined env=log_404

        <IfModule dir_module>
            DirectoryIndex     index.php index.html index.htm index.shtml
            # FallbackResource /index.php
        </IfModule>

        <IfModule proxy_module>
        <IfModule proxy_fcgi_module>
        <FilesMatch "\.(php|phtml)$">
            SetHandler         "proxy:fcgi://$backend_ip:$backend_port/"
            ProxyFCGISetEnvIf  "true" DOCUMENT_ROOT   "$web_root"
            ProxyFCGISetEnvIf  "true" HTTPS           "on"
            ProxyFCGISetEnvIf  "true" SCRIPT_FILENAME "$web_root%{reqenv:SCRIPT_NAME}"
            # ProxyFCGISetEnvIf  "%{reqenv:COUNTRY_CODE}   != ''" COUNTRY_CODE    "%{reqenv:COUNTRY_CODE}"
            # ProxyFCGISetEnvIf  "%{reqenv:COUNTRY_NAME}   != ''" COUNTRY_NAME    "%{reqenv:COUNTRY_NAME}"
            Include            "${SRVROOT}/conf/fastcgi.conf"
            IncludeOptional    "${SRVROOT}/conf/env/$host.conf"
        </FilesMatch>
        </IfModule>
        </IfModule>

        IncludeOptional        "${SRVROOT}/conf/custom/$host.conf"
    </VirtualHost>
    </IfModule>
</Macro>

<Macro Host_Proxy $host $bind_ip $server_aliases $web_root $backend_ip $backend_port>
    <VirtualHost $bind_ip>
        <Directory "$web_root">
            AllowOverride      All
            Require            all granted
            <FilesMatch "\.shtml$">
                Options        +Includes
            </FilesMatch>
            <IfModule cgi_module>
                <FilesMatch "\.(cgi|pl)$">
                    Options    +ExecCGI
                </FilesMatch>
            </IfModule>
        </Directory>
        ServerName             $host
        ServerAlias            $server_aliases
        DocumentRoot           "$web_root"

        # Include              "${SRVROOT}/conf/snippets/block_hidden_files.conf"
        # Include              "${SRVROOT}/conf/snippets/block_sensitive_files.conf"
        # Include              "${SRVROOT}/conf/snippets/compression.conf"
        # Include              "${SRVROOT}/conf/snippets/quiet_static_logs.conf"
        Include                "${SRVROOT}/conf/snippets/static_cache_control.conf"

        CustomLog              "${ROOTDIR}/logs/domains/$host_access.log" combined env=!dontlog
        ErrorLog               "${ROOTDIR}/logs/domains/$host_error.log"
        # SetEnvIf status 404  log_404
        # CustomLog            "${ROOTDIR}/logs/domains/$host_404.log" combined env=log_404

        ProxyPassMatch "\.(svg|png|jpe?g|gif|webp|avif|jxl|ico|tiff?|heic)$" "!"
        ProxyPassMatch "\.(css|m?js|map|webmanifest|wasm|json|jsonld|geojson|xml|txt|csv|pdf)$" "!"
        ProxyPassMatch "\.(eot|otf|ttc?|woff2?)$" "!"
        ProxyPassMatch "\.(mp[34g]|mov|webm|mpe?g|avi|ogv|wav|ogg|m4a|aac|midi?)$" "!"

        <IfModule proxy_module>
        <IfModule proxy_http_module>
            ProxyPreserveHost  On
            ProxyRequests      Off
            ProxyVia           full
            RequestHeader      unset Accept-Encoding
            ProxyPass          /ws/ "ws://$backend_ip:$backend_port/"
            ProxyPassReverse   /ws/ "ws://$backend_ip:$backend_port/"
            ProxyPass          / "http://$backend_ip:$backend_port/"
            ProxyPassReverse   / "http://$backend_ip:$backend_port/"
            <IfModule headers_module>
                RequestHeader  set X-Forwarded-For %{X-Forwarded-For}i
                RequestHeader  set X-Forwarded-Proto "http"
                RequestHeader  set X-Real-IP %{REMOTE_ADDR}e
                RequestHeader  set X-Request-Id "%{UNIQUE_ID}e"
            </IfModule>
        </IfModule>
        </IfModule>

        IncludeOptional        "${SRVROOT}/conf/custom/$host.conf"
    </VirtualHost>
</Macro>

<Macro Host_Proxy_SSL $host $bind_ip $server_aliases $web_root $tls_cert_file $tls_key_file $backend_ip $backend_port>
    <IfModule ssl_module>
    <VirtualHost $bind_ip>
        ServerName             $host
        ServerAlias            $server_aliases
        SSLEngine              on
        $tls_cert_file
        $tls_key_file
        <Directory "$web_root">
            AllowOverride      All
            Require            all granted
            <FilesMatch "\.shtml$">
                Options        +Includes
            </FilesMatch>
            <IfModule cgi_module>
                <FilesMatch "\.(cgi|pl)$">
                    Options    +ExecCGI
                </FilesMatch>
            </IfModule>
            <FilesMatch "\.(php|shtml|phtml|cgi|pl)$">
                SSLOptions     +StdEnvVars
            </FilesMatch>
        </Directory>
        DocumentRoot           "$web_root"

        # Include              "${SRVROOT}/conf/snippets/block_hidden_files.conf"
        # Include              "${SRVROOT}/conf/snippets/block_sensitive_files.conf"
        # Include              "${SRVROOT}/conf/snippets/compression.conf"
        # Include              "${SRVROOT}/conf/snippets/quiet_static_logs.conf"
        Include                "${SRVROOT}/conf/snippets/static_cache_control.conf"

        CustomLog              "${ROOTDIR}/logs/domains/$host_access.log" combined env=!dontlog
        ErrorLog               "${ROOTDIR}/logs/domains/$host_error.log"
        # SetEnvIf status 404  log_404
        # CustomLog            "${ROOTDIR}/logs/domains/$host_404.log" combined env=log_404

        ProxyPassMatch "\.(svg|png|jpe?g|gif|webp|avif|jxl|ico|tiff?|heic)$" "!"
        ProxyPassMatch "\.(css|m?js|map|webmanifest|wasm|json|jsonld|geojson|xml|txt|csv|pdf)$" "!"
        ProxyPassMatch "\.(eot|otf|ttc?|woff2?)$" "!"
        ProxyPassMatch "\.(mp[34g]|mov|webm|mpe?g|avi|ogv|wav|ogg|m4a|aac|midi?)$" "!"

        <IfModule proxy_module>
        <IfModule proxy_http_module>
            ProxyPreserveHost  On
            ProxyRequests      Off
            ProxyVia           full
            RequestHeader      unset Accept-Encoding
            ProxyPass          /ws/ "ws://$backend_ip:$backend_port/"
            ProxyPassReverse   /ws/ "ws://$backend_ip:$backend_port/"
            ProxyPass          / "http://$backend_ip:$backend_port/"
            ProxyPassReverse   / "http://$backend_ip:$backend_port/"
            <IfModule headers_module>
                RequestHeader  set X-Forwarded-For %{X-Forwarded-For}i
                RequestHeader  set X-Forwarded-Proto "https"
                RequestHeader  set X-Real-IP %{REMOTE_ADDR}e
                RequestHeader  set X-Request-Id "%{UNIQUE_ID}e"
            </IfModule>
        </IfModule>
        </IfModule>
        
        IncludeOptional        "${SRVROOT}/conf/custom/$host.conf"
    </VirtualHost>
    </IfModule>
</Macro>

# -----------------------------------------------------------------------------------
# Virtual Hosts
# -----------------------------------------------------------------------------------

{apache_hosts}

UndefMacro Host_Default
UndefMacro Host_Default_SSL
UndefMacro Host_Static
UndefMacro Host_Static_SSL
UndefMacro Host_PHP
UndefMacro Host_PHP_SSL
UndefMacro Host_Proxy
UndefMacro Host_Proxy_SSL
