#--------------------------------
# Maps
#--------------------------------

map $request_uri $loggable {
    default                      1;
#   ~^/pictures/                 0;
}

map $status $log_not_found {
    default                      0;
    404                          1;
}

map $request_uri $request_uri_path {
    "~^([^?]*)"                  $1;
}

map $http_accept_language $_error_lang {
    default                      en;
    ~^(he)\b                     he;
    ~^(ms)\b                     ms;
    ~^(ar)\b                     ar;
    ~^(en)\b                     en;
    ~^(ru)\b                     ru;
    ~^(ko)\b                     ko;
    ~^(ja)\b                     ja;
    ~^(zh-CN)\b                  zh-cn;
    ~^(zh-TW)\b                  zh-tw;
    ~^(de)\b                     de;
    ~^(fr)\b                     fr;
    ~^(es-MX)\b                  es-mx;
    ~^(es)\b                     es;
    ~^(pt-BR)\b                  pt-br;
    ~^(pt)\b                     pt;
    ~^(it)\b                     it;
    ~^(uk)\b                     uk;
    ~^(pl)\b                     pl;
    ~^(nl)\b                     nl;
    ~^(sv)\b                     sv;
    ~^(da)\b                     da;
    ~^(fi)\b                     fi;
    ~^(no)\b                     no;
    ~^(hi)\b                     hi;
    ~^(vi)\b                     vi;
    ~^(th)\b                     th;
    ~^(id)\b                     id;
    ~^(tr)\b                     tr;
    ~^(cs)\b                     cs;
    ~^(ro-MD)\b                  ro-md;
    ~^(ro)\b                     ro;
    ~^(be)\b                     be;
    ~^(az)\b                     az;
    ~^(kk)\b                     kk;
    ~^(uz)\b                     uz;
    ~^(sr)\b                     sr;
    ~^(hr)\b                     hr;
    ~^(sl)\b                     sl;
    ~^(el)\b                     el;
    ~^(hu)\b                     hu;
    ~^(sk)\b                     sk;
    ~^(bg)\b                     bg;
    ~^(lt)\b                     lt;
    ~^(lv)\b                     lv;
    ~^(et)\b                     et;
    ~^(ka)\b                     ka;
}

map $http_upgrade $connection_upgrade {
    default                      upgrade;
    ""                           "close";
}

map $remote_addr $proxy_forwarded_elem {
    default                      "for=unknown";

    # IPv4 addresses can be sent as-is
    ~^[0-9.]+$                   "for=$remote_addr";

    # IPv6 addresses need to be bracketed and quoted
    ~^[0-9A-Fa-f:.]+$            "for=\"[$remote_addr]\"";
}

map $http_forwarded $proxy_add_forwarded {
        default                  "$proxy_forwarded_elem";

        # If the incoming Forwarded header is syntactically valid, append to it
        "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";
}

map $http_origin $cors_allowed_origin {
    default                      "";
    "https://example.com"        $http_origin;
    "https://app.example.com"    $http_origin;
}

map $request_method $is_options {
    default 0;
    OPTIONS 1;
}

map $http_access_control_request_method $is_preflight {
    default 0;
    ""      0;
    ~.+     1;
}

map $scheme $hsts_header {
    default "";
    https   "max-age=86400; includeSubDomains";
}

map $http_host $non_www_host {
    ~^www\.(.+)$ $1;
    default "";
}

map $http_x_forwarded_proto $redirect_proto {
    ~^https$ https;
    default $scheme;
}

#--------------------------------
# Brotli
#--------------------------------

brotli                           off;
brotli_buffers                   256 4k;
brotli_comp_level                3;
brotli_min_length                1024;
brotli_static                    off;
brotli_types                     application/atom+xml application/json application/ld+json application/rss+xml application/geo+json application/xml application/rdf+xml application/javascript application/manifest+json application/x-web-app-manifest+json application/rtf application/x-x509-ca-cert application/xhtml+xml application/xslt+xml application/schema+json image/svg+xml application/vnd.ms-fontobject font/ttf font/collection font/otf text/css text/csv text/plain text/x-component text/markdown text/calendar text/vcard text/vtt text/cache-manifest;

#--------------------------------
# Gzip
#--------------------------------

gzip                             off;
gzip_buffers                     256 4k;
gzip_comp_level                  3;
gzip_min_length                  1024;
gzip_proxied                     any;
gzip_static                      off;
gzip_types                       application/atom+xml application/json application/ld+json application/rss+xml application/geo+json application/xml application/rdf+xml application/javascript application/manifest+json application/x-web-app-manifest+json application/rtf application/x-x509-ca-cert application/xhtml+xml application/xslt+xml application/schema+json image/svg+xml application/vnd.ms-fontobject font/ttf font/collection font/otf text/css text/csv text/plain text/x-component text/markdown text/calendar text/vcard text/vtt text/cache-manifest;
gzip_vary                        on;

#--------------------------------
# Logs
#--------------------------------

log_format                       post_log  '$remote_addr - $remote_user [$time_local] $status "$request" $body_bytes_sent $request_body';
log_format                       ssl_log   '$remote_addr - $remote_user [$time_local] $ssl_protocol $ssl_cipher "$request" $body_bytes_sent';
log_format                       not_found '$remote_addr - $host "$request"';
log_not_found                    on;
log_subrequest                   off;
access_log                       '{root_dir}/logs/{module_name}/access.log' combined;

#--------------------------------
# Options
#--------------------------------

autoindex                        off;
autoindex_localtime              on;
autoindex_exact_size             off;
charset                          utf-8;
charset_types                    application/atom+xml application/json application/ld+json application/rss+xml application/geo+json application/xml application/rdf+xml application/javascript application/wasm application/manifest+json application/x-web-app-manifest+json text/cache-manifest text/css text/csv text/plain text/x-component text/markdown text/calendar text/vcard text/vtt application/rtf application/pdf application/x-x509-ca-cert application/xhtml+xml application/xslt+xml application/schema+json;
client_body_buffer_size          64k;
client_header_timeout            10s;
client_max_body_size             160m;
# ignore_invalid_headers         off;
index                            index.php index.html index.htm;
keepalive_timeout                15s;
keepalive_requests               200;
large_client_header_buffers      128 4k;
# max_ranges                     1;
# open_file_cache                max=1024;
open_log_file_cache              max=1024;
reset_timedout_connection        on;
# resolver                       1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 ipv6=off;
resolver_timeout                 5s;
send_timeout                     30s;
server_names_hash_bucket_size    64;
server_names_hash_max_size       4096;
server_tokens                    off;
tcp_nodelay                      on;
types_hash_bucket_size           64;
types_hash_max_size              4096;
variables_hash_bucket_size       64;
variables_hash_max_size          4096;

#--------------------------------
# PHP FastCGI
#--------------------------------

fastcgi_buffering                on;
fastcgi_buffers                  256 4k;
fastcgi_connect_timeout          5s;
fastcgi_ignore_client_abort      off;
fastcgi_index                    index.php;
fastcgi_intercept_errors         on;
fastcgi_read_timeout             15m;

#--------------------------------
# Proxy
#--------------------------------

proxy_buffering                  on;
proxy_buffers                    256 4k;
proxy_connect_timeout            5s;
proxy_ignore_client_abort        off;
proxy_intercept_errors           on;
proxy_http_version               1.1;
proxy_read_timeout               15m;

#--------------------------------
# SSL
#--------------------------------

ssl_ciphers                      ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_dhparam                      '{root_dir}/user/ssl/dhparam.pem';
ssl_ecdh_curve                   X25519:prime256v1:secp384r1;
ssl_prefer_server_ciphers        off;
ssl_protocols                    TLSv1.2 TLSv1.3;
ssl_session_cache                shared:SSL:10m;
ssl_session_tickets              off;
ssl_session_timeout              1d;
ssl_stapling                     off;
ssl_stapling_verify              off;
ssl_trusted_certificate          '{root_dir}/data/ssl/cacert.pem';

#--------------------------------
# Temp
#--------------------------------

client_body_temp_path            '{root_dir}/temp/{module_name}/{profile_name}/client_temp'  1 2;
fastcgi_temp_path                '{root_dir}/temp/{module_name}/{profile_name}/fastcgi_temp' 1 2;
proxy_temp_path                  '{root_dir}/temp/{module_name}/{profile_name}/proxy_temp'   1 2;
scgi_temp_path                   '{root_dir}/temp/{module_name}/{profile_name}/scgi_temp'    1 2;
uwsgi_temp_path                  '{root_dir}/temp/{module_name}/{profile_name}/uwsgi_temp'   1 2;

#--------------------------------
# Zones
#--------------------------------

limit_conn_log_level             warn;
limit_conn_zone                  $binary_remote_addr zone=ip_zone:16m;
limit_conn_zone                  $binary_remote_addr$request_uri_path zone=ip_uri_zone:16m;

limit_req_log_level              warn;
limit_req_zone                   $binary_remote_addr zone=ip_flood:16m rate=64r/s;
limit_req_zone                   $binary_remote_addr$request_uri_path zone=ip_uri_flood:16m rate=16r/s;

#--------------------------------
# Virtual Hosts
#--------------------------------

{nginx_hosts}

}