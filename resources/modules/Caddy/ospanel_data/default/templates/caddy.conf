# ===================================================================================
# Caddy — modern web server & reverse proxy
# -----------------------------------------------------------------------------------
# This section documents the Caddy build used by this deployment.
#
# Included modules (build features) list the optional modules compiled into
# the Caddy binary (e.g., ACME DNS providers for DNS-01 challenges, additional
# HTTP handlers, authentication, rate limiting, observability/logging, etc.).
#
# Notes:
# - The runtime configuration (Caddyfile/JSON) can only use modules present in
#   this build.
# - If a required feature is missing, Caddy must be rebuilt with the module.
# ===================================================================================

