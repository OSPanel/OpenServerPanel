# -----------------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------------

{
    admin off
    grace_period 5s
    acme_ca https://acme-v02.api.letsencrypt.org/directory
    key_type p256
    ocsp_stapling off
    order webdav before file_server

    # Disable Caddy's automatic HTTP->HTTPS redirects; we control redirects via snippets.
    auto_https disable_redirects

    # Persist TLS/ACME data inside project storage directory.
    storage file_system {
        root {root_dir}/data/{module_name}/{profile_name}/storage
    }

    # Global log verbosity (per-host logs are defined in common_host).
    log {
        level {log_level}
        format json
    }

    servers {
        # Conservative timeouts suitable for uploads / long-running PHP responses.
        timeouts {
            read_header  10s
            read_body    30m
            write        30m
            idle         1m
        }

        # Force HTTP/1.1 only (compatibility mode). Remove to allow h2/h3.
        protocols h1

        # Private_ranges 192.168.0.0/16 172.16.0.0/12 10.0.0.0/8 127.0.0.1/8 fd00::/8 ::1
        trusted_proxies static private_ranges

        # OPTION: Enforce trusted proxy rules strictly
        trusted_proxies_strict

        # --- Cloudflare proxy (real client IP) --------------------------------------
        # Enable only when this server is behind Cloudflare (orange-cloud / proxying).
        # Purpose: trust Cloudflare edge IPs and use CF-Connecting-IP as the client IP.
        # https://github.com/WeidiDeng/caddy-cloudflare-ip

        # OPTION: Use Cloudflare-provided client IP header
        # client_ip_headers CF-Connecting-IP

        # OPTION: Auto-refresh Cloudflare IP ranges and trust them as proxies
        # trusted_proxies cloudflare {
        #     interval 12h
        #     timeout 15s
        # }
    }

    # --- GeoIP2 (caddy-geoip2) -----------------------------------------------------
    # https://github.com/zhangjiayin/caddy-geoip2
    #
    # OPTIONS:
    # - geoip2_vars should be early (see the order directive below)
    # 
    # order geoip2_vars first
    # geoip2 {
    #     editionID         "dbip-country-lite"
    #     databaseDirectory "{root_dir}/user/geo"
    # }
}

# -----------------------------------------------------------------------------------
# Helpers
# -----------------------------------------------------------------------------------

# Static file matcher (by extension)
(static_files) {
    @static {
        path *.svg *.png *.jpeg *.jpg *.gif *.webp *.avif *.jxl *.ico *.tif *.tiff *.heic
        path *.css *.js *.mjs *.map *.webmanifest *.wasm *.json *.jsonld *.geojson *.xml *.txt *.csv *.pdf
        path *.eot *.otf *.ttf *.ttc *.woff *.woff2
        path *.mp4 *.mov *.webm *.mpeg *.mpg *.avi *.ogv *.mp3 *.wav *.ogg *.m4a *.aac *.mid *.midi
    }
}

# Friendly error pages
(friendly_error_common) {
    header {
        -ETag
        -Last-Modified
        Cache-Control   "no-store, max-age=0, must-revalidate"
        Expires         "Thu, 01 Jan 1970 00:00:01 GMT"
        Content-Type    "text/html; charset=utf-8"
    }
    root * {root_dir}/system/error_pages
    file_server
}

# FastCGI error interception
(fastcgi_intercept_errors) {
    @4xx status 4xx
    handle_response @4xx {
        error {http.response.status}
    }
    @5xx status 5xx
    handle_response @5xx {
        error {http.response.status}
    }
}

# -----------------------------------------------------------------------------------
# Snippets
# -----------------------------------------------------------------------------------

# Redirect www → apex
(force_non_www) {
    @www_https {
        header_regexp Host (?i)^www\.(.+)$
        header_regexp X-Forwarded-Proto (?i)^https$
    }
    @www_https_direct {
        header_regexp Host (?i)^www\.(.+)$
        protocol https
        not header X-Forwarded-Proto *
    }
    @www_http {
        header_regexp Host (?i)^www\.(.+)$
        not header_regexp X-Forwarded-Proto (?i)^https$
        not protocol https
    }
    redir @www_https https://{re.Host.1}{uri} 301
    redir @www_https_direct https://{re.Host.1}{uri} 301
    redir @www_http http://{re.Host.1}{uri} 301
}

# Redirect HTTP → HTTPS
(force_https) {
    @insecure {
        not header_regexp X-Forwarded-Proto (?i)^https$
        not protocol https
    }
    redir @insecure https://{host}{uri} 301
}

# Enable zstd/br/gzip compression
(compression) {
    encode {
        zstd default
        br   3
        gzip 3
        minimum_length 1024
    }
}

# Disable access logs for favicon.ico and robots.txt
(quiet_static_logs) {
    @skip path /favicon.ico /robots.txt
    log_skip @skip
}

# CORS headers
(cors_headers) {
    @allowed_origin header Origin {args[0]}

    @cors_preflight {
        method OPTIONS
        header Origin *
        header Access-Control-Request-Method *
    }

    handle @cors_preflight {
        handle @allowed_origin {
            header {
                Access-Control-Allow-Origin      "{http.request.header.Origin}"
                Access-Control-Allow-Credentials "true"
                Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With"
                Access-Control-Max-Age           "600"
                Vary                             "Origin"
            }
            respond "" 204
        }
        respond "" 403
    }

    header @allowed_origin {
        Access-Control-Allow-Origin      "{http.request.header.Origin}"
        Access-Control-Allow-Credentials "true"
        Vary "Origin"
    }
}

# Security headers
(security_headers) {
    header { 
        X-Request-Id                             "{http.request.uuid}"
        defer Referrer-Policy                    "strict-origin-when-cross-origin"
        defer Timing-Allow-Origin                "*"
        defer X-Content-Type-Options             "nosniff"
        defer X-Frame-Options                    "SAMEORIGIN"

        # HSTS
        # defer Strict-Transport-Security        "max-age=86400; includeSubDomains"
        
        # defer Content-Security-Policy          "default-src 'self'; base-uri 'self'; connect-src 'self' https: wss:; font-src 'self' https: data:; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; manifest-src 'self'; media-src 'self' https: data: blob:; object-src 'none'; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; style-src 'self' https: 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests"
        # defer Permissions-Policy               "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

        # Disable Server/X-Powered-By headers:

        # -Server
        # -X-Powered-By

        # Disable external embedding if needed:

        # defer Cross-Origin-Embedder-Policy     "require-corp"
        # defer Cross-Origin-Opener-Policy       "same-site"
        # defer Cross-Origin-Resource-Policy     "same-site"
        # defer Content-Security-Policy          "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; manifest-src 'self'; media-src 'self' data: blob:; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests"
    }
}

# Cache headers for static assets (by extensions)
(cache_headers) {
    header @static {
        # Only for PROD environments
        # defer Cache-Control "public, max-age=3600, must-revalidate"
        # Only if ?v= is used for versioning
        # defer Cache-Control "public, max-age=31536000, immutable"
        # Only for DEV environments
        defer Cache-Control "max-age=0, must-revalidate"
    }
}

# Friendly error pages with maintenance support
(friendly_errors) {
    handle_errors {
        @lang header_regexp lang Accept-Language ^([A-Za-z]{2})

        @maint503 {
            expression {http.error.status_code} == 503
            header X-Maintenance 1
        }

        handle @maint503 {
            handle @lang {
                try_files /503.html.mt.{http.regexp.lang.1} /503.html.mt.en
                import friendly_error_common
            }
            handle {
                try_files /503.html.mt.en
                import friendly_error_common
            }
        }

        # Normal errors
        handle @lang {
            try_files /{http.error.status_code}.html.{http.regexp.lang.1} /{http.error.status_code}.html.en
            import friendly_error_common
        }
        handle {
            try_files /{http.error.status_code}.html.en
            import friendly_error_common
        }
    }
}

# Maintenance mode
# Goal: return HTTP 503 and show a friendly error page when maintenance is active.
# How to enable:
# - Place /maintenance.html or /maintenance.txt or /maintenance.flag in site root.
(maintenance_route) {
    @maintenance file /maintenance.html /maintenance.txt /maintenance.flag
    handle @maintenance {
        request_header X-Maintenance "1"
        error 503
    }
}

# Block access to hidden files/folders (starting with .)
(block_hidden_files) {
    @hidden {
        path_regexp (?:^|/)\..+
        not path /.well-known/*
        not path_regexp ^/(bitrix|local)/.+/\.
    }
    handle @hidden {
        error 403
    }
}

# Block access to sensitive files (backups, configs, logs, etc.)
(block_sensitive_files) {
    @sensitiveFiles path_regexp (?i)\.(bak|conf|config|cnf|ini|inc|log|sh|sql|tar|tgz)$|~$
    handle @sensitiveFiles {
        error 403
    }
}

# Block access for specific countries (GeoIP2)
(block_country_by_geoip) {
    geoip2_vars trusted_proxies
    @block expression ({geoip2.country_code} == "XX") || ({geoip2.country_code} == "XY")
    handle @block {
        error 451
    }
}

# Block requests not coming via trusted proxies
# Works only if trusted_proxies_strict is enabled
(block_untrusted_proxy) {
    @untrusted {
        # not remote_ip cloudflare
        not remote_ip private_ranges
    }
    handle @untrusted {
        abort
    }
}

# Webdav configuration
(webdav_config) {
    @davNoSlash path /dav
    redir @davNoSlash /dav/ 308
    @dav {
        path /dav
        path /dav/*
    }
    handle @dav {
        root * {http.vars.root}/dav
        basicauth {
            # USER/PASSWORD admin/admin (caddy.exe hash-password --plaintext "admin"):
            admin $2a$14$wj6diot4tEZcIo0fMYHLYO2hZWtg0vaM1zCc5inQ39HAtO/3E2WmS
        }
        webdav /dav* {
            prefix /dav
        }
        webdav /dav* {
            prefix /dav
        }
    }
}

# Timeouts
(timeouts_config) {
    dial_timeout 5s
    read_timeout 15m
    write_timeout 60s
}

# Common host configuration
(common_host) {
    # Limit incoming request body to protect from oversized uploads/DoS.
    request_body {
        max_size 160MB
    }
    log {
        output file "{root_dir}/logs/domains/{args[0]}_caddy.log" {
            # roll_keep 10
            # roll_size 100MiB
            # roll_local_time
        }
        format transform `{request>remote_ip} - {request>headers>Authorization>[0]:--} [{ts}] "{request>method} {request>uri} {request>proto}" {status} {size} "{request>headers>Referer>[0]:--}" "{request>headers>User-Agent>[0]:--}"` {
            time_format "02/Jan/2006:15:04:05 -0700"
            time_local
        }
        level {log_level}
    }

    # import force_non_www
    # import force_https
    # import compression
    # import quiet_static_logs
    import static_files
    import security_headers
    import cache_headers
    import friendly_errors
    import maintenance_route
    import block_hidden_files
    # import block_sensitive_files
    # import block_country_by_geoip
    # import block_untrusted_proxy
}

# -----------------------------------------------------------------------------------
# Host templates
# -----------------------------------------------------------------------------------

# Default virtual host
(host_default) {
    root * "{root_dir}/system/public_html/default"
    import common_host default
    try_files {path} {path}/ /index.html =404
    file_server
}

# Static virtual host
(host_static) {
    import common_host {args[0]}

    # import webdav_config

    file_server {
        # precompressed

        # Only for DEV environments
        browse
    }
}

# PHP host (multi-entry):
# - static assets served directly by Caddy
# - PHP only when *.php is requested OR when index.php exists in directory
(host_php) {
    import common_host {args[0]}

    # Uncomment the 2 lines below to enable CORS for the API paths
    # @api path /api/*
    # header @api Access-Control-Allow-Origin "*"
    # or
    # import cors_headers https://example.local

    # import webdav_config

    @indexphp {
        file {
            try_files {path}/index.php {path}index.php
        }
    }
    rewrite @indexphp {file_match.relative}
    request_header X-Request-Id {http.request.uuid}

    @php path *.php
    php_fastcgi @php {args[1]}:{args[2]} {
        import env_{args[0]}
        # env COUNTRY_CODE {geoip2.country_code}
        # env COUNTRY_NAME {geoip2.country_name}
        import fastcgi_intercept_errors
        import timeouts_config
        try_files {path} =404
    }

    file_server {
        # precompressed

        # Only for DEV environments
        browse
    }
}

# PHP host (single entry point / front controller):
# - all non-static requests go to /index.php (typical frameworks: Laravel/Symfony)
(host_php_sep) {
    import common_host {args[0]}

    # Uncomment the 2 lines below to enable CORS for the API paths
    # @api path /api/*
    # header @api Access-Control-Allow-Origin "*"
    # or
    # import cors_headers https://example.local

    # import webdav_config

    request_header X-Request-Id {http.request.uuid}

    php_fastcgi {args[1]}:{args[2]} {
        env X_REQUEST_ID {http.request.uuid}
        import env_{args[0]}
        # env COUNTRY_CODE {geoip2.country_code}
        # env COUNTRY_NAME {geoip2.country_name}
        import timeouts_config
        import fastcgi_intercept_errors
        try_files {path} /index.php
    }

    file_server {
        # precompressed
    }
}

# Reverse proxy virtual host
# - all non-static requests go to backend (app)
(host_proxy) {
    import common_host {args[0]}

    # Uncomment the 2 lines below to enable CORS for the API paths
    # @api path /api/*
    # header @api Access-Control-Allow-Origin "*"
    # or
    # import cors_headers https://example.local

    # import webdav_config

    # handle @static {
    #     try_files {path} =404
    #     file_server
    # }

    request_header X-Request-Id {http.request.uuid}

    reverse_proxy {args[1]}:{args[2]} {
        transport http {
            import timeouts_config
        }
    }
}

