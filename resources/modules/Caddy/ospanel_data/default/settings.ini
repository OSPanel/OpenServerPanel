[main]

additional_ssl_hosts     =
clean_directories        = {root_dir}\temp\{module_name}\{profile_name}
ignore_shutdown_all      = off
ip                       = auto
log_directory            = {root_dir}\logs\{module_name}
log_level_values         = error info
log_level                = info
ssl_auto_cert            = on
start_command            = "{root_dir}\modules\{module_name}\caddy.exe" run --config "{root_dir}\modules\{module_name}\Caddyfile"
start_directory          = {root_dir}\modules\{module_name}
work_directories         = {root_dir}\logs\domains {root_dir}\temp\{module_name}\{profile_name} {root_dir}\data\{module_name}\{profile_name} {root_dir}\data\{module_name}\{profile_name}\config {root_dir}\data\{module_name}\{profile_name}\data {root_dir}\data\{module_name}\{profile_name}\state {root_dir}\data\{module_name}\{profile_name}\storage

allowed_system_env_vars  = auto
log_max_filesize         = auto
log_write_title          = auto
max_probation_fails      = auto
max_shutdown_time        = auto
probation                = auto
silent_mode              = auto
terminal_codepage        = auto
time_zone                = auto
used_addons_environment  = auto

[caddy.conf]

comment                  = #
destination              = {root_dir}\modules\{module_name}\Caddyfile
directory_separator      = /
enabled                  = on
encoding                 = UTF8

[env.bat]

comment                  = ::
destination              = {root_dir}\data\cli\env_{module_name}.bat
directory_separator      = \
enabled                  = on
encoding                 = UTF8
source_dir               = {root_dir}\system\templates

[environment]

PATH                     = {root_dir}\modules\{module_name};%PATH%
ROOT_DIR                 = {root_dir}\modules\{module_name}
TEMP                     = {root_dir}\temp\{module_name}\{profile_name}
TMP                      = {root_dir}\temp\{module_name}\{profile_name}
TZ                       = {time_zone}
XDG_CONFIG_HOME          = {root_dir}\data\{module_name}\{profile_name}\config
XDG_DATA_HOME            = {root_dir}\data\{module_name}\{profile_name}\data
XDG_STATE_HOME           = {root_dir}\data\{module_name}\{profile_name}\state
