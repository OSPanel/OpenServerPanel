[main]

additional_ssl_hosts     =
clean_directories        = {root_dir}\temp\{module_name}\{profile_name}
ignore_shutdown_all      = off
ip                       = auto
port                     = 8200
log_directory            = {root_dir}\logs\{module_name}
log_level_values         = err warn info debug trace
log_level                = info
shell_command            =
ssl_auto_cert            = on
start_command            = "{root_dir}\modules\{module_name}\vault.exe" server -config="{root_dir}\data\{module_name}\{profile_name}\vault.hcl"
start_directory          = {root_dir}\modules\{module_name}
web_ui_url               = https://{module_name}:{port}/
work_directories         = {root_dir}\data\{module_name}\{profile_name} {root_dir}\temp\{module_name}\{profile_name}

allowed_system_env_vars  = auto
log_max_filesize         = auto
log_write_title          = auto
max_probation_fails      = auto
max_shutdown_time        = auto
probation                = auto
silent_mode              = auto
terminal_codepage        = auto
time_zone                = auto
used_addons_environment  = auto

[vault.hcl]

destination              = {root_dir}\data\{module_name}\{profile_name}\vault.hcl
enabled                  = on
encoding                 = UTF8
directory_separator      = /

[env.bat]

comment                  = ::
destination              = {root_dir}\data\cli\env_{module_name}.bat
enabled                  = on
encoding                 = UTF8
directory_separator      = \
source_dir               = {root_dir}\system\templates

[environment]

PATH                     = {root_dir}\modules\{module_name};%PATH%
TEMP                     = {root_dir}\temp\{module_name}\{profile_name}
TMP                      = {root_dir}\temp\{module_name}\{profile_name}
TZ                       = {time_zone}
VAULT_ADDR               = https://{ip}:{port}
VAULT_AGENT_ADDR         =
VAULT_CACERT             = {root_dir}\data\ssl\root\cert.crt
VAULT_CAPATH             =
VAULT_CLI_NO_COLOR       = 0
VAULT_CLIENT_CERT        =
VAULT_CLIENT_KEY         =
VAULT_CLIENT_TIMEOUT     = 60s
VAULT_CLUSTER_ADDR       =
VAULT_DISABLE_REDIRECTS  = 0
VAULT_FORMAT             =
VAULT_HTTP_PROXY         =
VAULT_LICENSE            =
VAULT_LICENSE_PATH       =
VAULT_LOG_FORMAT         = standard
VAULT_LOG_LEVEL          = {log_level}
VAULT_MAX_RETRIES        = 2
VAULT_MFA                =
VAULT_NAMESPACE          =
VAULT_PROXY_ADDR         =
VAULT_RATE_LIMIT         =
VAULT_REDIRECT_ADDR      =
VAULT_SKIP_VERIFY        = 0
VAULT_SRV_LOOKUP         = 0
VAULT_TLS_SERVER_NAME    =
VAULT_TOKEN              =
VAULT_WRAP_TTL           =
