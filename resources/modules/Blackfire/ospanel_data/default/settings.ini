[main]

additional_ssl_hosts          =
clean_directories             = {root_dir}\temp\{module_name}\{profile_name}
ignore_shutdown_all           = off
ip                            = 127.0.0.1
port                          = 8307
ssl_auto_cert                 = off
start_command                 = {root_dir}\modules\{module_name}\blackfire.exe --no-ansi --no-interaction agent:start
start_directory               = {root_dir}\modules\{module_name}
work_directories              = {root_dir}\temp\{module_name}\{profile_name}

allowed_system_env_vars       = auto
log_max_filesize              = auto
log_write_title               = auto
max_probation_fails           = auto
max_shutdown_time             = auto
probation                     = auto
silent_mode                   = auto
terminal_codepage             = auto
time_zone                     = auto
used_addons_environment       = auto

[.blackfire.ini]

comment                       = ;
destination                   = {root_dir}\modules\{module_name}\.blackfire.ini
directory_separator           = /
enabled                       = on
encoding                      = UTF8

[agent.ini]

comment                       = ;
destination                   = {root_dir}\modules\{module_name}\agent.ini
directory_separator           = /
enabled                       = on
encoding                      = UTF8

[env.bat]

comment                       = ::
destination                   = {root_dir}\data\cli\env_{module_name}.bat
directory_separator           = \
enabled                       = on
encoding                      = UTF8
source_dir                    = {root_dir}\system\templates

[environment]

BLACKFIRE_CONFIG              = {root_dir}\modules\{module_name}\agent.ini
BLACKFIRE_HOME                = {root_dir}\modules\{module_name}
PATH                          = {root_dir}\modules\{module_name};%PATH%
TEMP                          = {root_dir}\temp\{module_name}\{profile_name}
TMP                           = {root_dir}\temp\{module_name}\{profile_name}