<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, shrink-to-fit=no'>
    <title>{lang_err_default_domain_title}</title>
    <style>
    a {
        background-color: transparent;
        -webkit-text-decoration-skip: objects;
    }
    a:active,
    a:hover {
        outline-width: 0;
    }
    *,
    *:after,
    *:before {
        box-sizing: inherit;
        margin: 0;
        padding: 0;
    }
    html {
        box-sizing: border-box;
        font-size: 1px !important;
    }

    /* Светлая тема (по умолчанию) */
    :root {
        --background-color: #F4F6F9;
        --text-color: #000;
        --heading-color: #000;
        --link-color: #0066cc;
        --link-hover-color: #004c99;
    }

    /* Тёмная тема */
    @media (prefers-color-scheme: dark) {
        :root {
            --background-color: #1e1e1e;
            --text-color: #e0e0e0;
            --heading-color: #ffffff;
            --link-color: #4eccff;
            --link-hover-color: #7ad7ff;
        }
    }

    body {
        font: normal 16rem/23rem 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
        background-color: var(--background-color);
        color: var(--text-color);
    }

    a {
        color: var(--link-color);
    }

    a:active,
    a:hover {
        color: var(--link-hover-color);
    }

    *,
    *:after,
    *:before {
        color: var(--text-color);
    }

    .outer {
        display: table;
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
    }
    .middle {
        display: table-cell;
        vertical-align: middle;
    }
    .inner {
        margin-left: auto;
        margin-right: auto;
        max-width: 660rem;
        min-width: 360rem;
        padding: 20rem;
        position: relative;
    }
    h1 {
        line-height: 65rem;
        font-size: 48rem;
        margin: 0 0 45rem 0;
        color: var(--heading-color);
    }
    </style>
</head>

<body>
    <div class='outer'>
        <div class='middle'>
            <div class='inner'>
                <h1>{lang_err_default_domain_title}</h1>{lang_err_default_domain_text_1}<br><br>{lang_err_default_domain_text_2}
            </div>
        </div>
    </div>
</body>

</html>
